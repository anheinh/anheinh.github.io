<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>谢时庆 · 导演/剪辑</title>
<meta name="description" content="谢时庆 — 导演、剪辑、创意策划。用镜头讲故事。">
<meta property="og:title" content="谢时庆 · 导演/剪辑">
<meta property="og:description" content="用镜头讲故事。导演 / 剪辑 / 创意策划。">
<meta property="og:image" content="https://anheinh.github.io/og.jpg">
<meta property="og:url" content="https://anheinh.github.io/">
<style>
:root{
  --bg:#0a0a0a;--fg:#e8e4dd;--muted:#7a756e;--dim:#2a2620;
  --gold:#c8a45c;--red:#b5343a;--cyan:#3a8a9e;
  --font-serif:"Noto Serif SC","STSong","Songti SC","SimSun",serif;
  --font-sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{font-family:var(--font-sans);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}

/* 电影颗粒 */
body::before{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.04;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* 音乐按钮 */
#musicBtn{
  position:fixed;bottom:28px;right:28px;z-index:100;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--dim);
  background:rgba(10,10,10,.8);color:var(--muted);cursor:pointer;
  font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .4s;
}
#musicBtn:hover{border-color:var(--gold);color:var(--gold)}
#musicBtn.on{border-color:var(--cyan);color:var(--cyan)}

/* ===== 开场 Hero — 电影海报 ===== */
.hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:3rem 2rem;position:relative;scroll-snap-align:start;
}
.hero .lede{font-size:.65rem;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:2rem;opacity:0;animation:fadeIn 1s .3s forwards}
.hero h1{font-family:var(--font-serif);font-size:clamp(3rem,8vw,7rem);font-weight:900;line-height:.95;letter-spacing:0;opacity:0;animation:fadeIn 1s .6s forwards}
.hero h1 .line{display:block}
.hero .sub{font-size:1rem;color:var(--muted);margin-top:2rem;letter-spacing:.1em;max-width:420px;opacity:0;animation:fadeIn 1s .9s forwards}
.hero .scroll{position:absolute;bottom:2rem;color:var(--dim);font-size:.6rem;letter-spacing:.3em;opacity:0;animation:fadeIn 1s 1.5s forwards}

@keyframes fadeIn{to{opacity:1}}

/* ===== 画面 ===== */
.story{min-height:100vh;display:flex;align-items:center;padding:4rem 2rem;scroll-snap-align:start;position:relative}
.story .container{max-width:1100px;margin:0 auto;width:100%}

/* 章节标题 */
.chapter{font-family:var(--font-serif);font-size:clamp(2rem,5vw,3.5rem);font-weight:700;line-height:1.2;margin-bottom:3rem}
.chapter .num{display:block;font-size:.7rem;letter-spacing:.4em;color:var(--gold);margin-bottom:1rem;font-family:var(--font-sans)}

/* ===== 关于 ===== */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.about-text h3{font-family:var(--font-serif);font-size:1.8rem;margin-bottom:1.5rem}
.about-text p{color:var(--muted);font-size:.95rem;line-height:2;margin-bottom:2rem}
.skills{display:flex;gap:.5rem;flex-wrap:wrap}
.skills span{padding:.3rem 1rem;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--dim);color:var(--muted)}
.about-visual{position:relative;display:flex;flex-direction:column;align-items:center}
.about-visual .frame{width:240px;height:320px;border:1px solid var(--dim);display:flex;align-items:center;justify-content:center;font-size:5rem;position:relative}
.about-visual .frame::after{content:'';position:absolute;inset:12px;border:1px solid var(--dim)}
.about-visual .label{margin-top:1.5rem;font-size:.6rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}

/* ===== 作品 — 电影海报网格 ===== */
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}
.poster{position:relative;overflow:hidden;cursor:pointer;aspect-ratio:2/3;border:1px solid #1a1a1a;transition:all .6s cubic-bezier(.2,.1,.1,1)}
.poster:hover{transform:scale(1.03);z-index:2;border-color:var(--gold)}
.poster .bg{width:100%;height:100%;object-fit:cover;transition:all .8s;filter:grayscale(.3) brightness(.5)}
.poster:hover .bg{transform:scale(1.08);filter:grayscale(0) brightness(.3)}
.poster::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 40%,transparent 70%,rgba(0,0,0,.4) 100%);z-index:1;opacity:0;transition:opacity .5s}
.poster:hover::before{opacity:1}
.poster .meta{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:2rem;transform:translateY(20px);opacity:0;transition:all .5s}
.poster:hover .meta{transform:translateY(0);opacity:1}
.poster .meta .cat{font-size:.55rem;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin-bottom:.5rem}
.poster .meta .title{font-family:var(--font-serif);font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:.02em}
.poster .meta .dur{font-size:.65rem;color:var(--muted);margin-top:.5rem}
.poster .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;width:60px;height:60px;border:2px solid rgba(255,255,255,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .5s}
.poster:hover .play-icon{border-color:var(--red);background:rgba(181,51,58,.15)}
.poster .play-icon::after{content:'';border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:3px}

/* 空态 */
.empty-state{grid-column:1/-1;text-align:center;padding:6rem 2rem;border:1px solid var(--dim)}
.empty-state .icon{font-size:3rem;margin-bottom:1rem}
.empty-state p{color:var(--muted);font-size:.85rem}

/* ===== 联系 — 演职员表 ===== */
.credits{font-family:var(--font-serif);font-size:1.2rem;line-height:2.5;color:var(--muted)}
.credits .role{display:block;font-size:.55rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;font-family:var(--font-sans)}
.credits .name{color:var(--fg);font-size:1.4rem}

/* ===== 灯光效果 ===== */
.light{position:fixed;border-radius:50%;filter:blur(120px);opacity:.06;pointer-events:none;z-index:0}
.light.l1{width:600px;height:600px;background:var(--gold);top:-200px;left:-200px;animation:drift 20s ease-in-out infinite}
.light.l2{width:500px;height:500px;background:var(--cyan);bottom:-200px;right:-200px;animation:drift 25s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(100px,50px)}50%{transform:translate(-50px,100px)}75%{transform:translate(-100px,-20px)}}

/* Modal */
.modal{display:none;position:fixed;inset:0;z-index:1001;background:rgba(0,0,0,.96);align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-close{position:absolute;top:28px;right:28px;z-index:2;width:44px;height:44px;border:1px solid var(--dim);background:transparent;color:var(--muted);font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-inner{width:90vw;max-width:1000px;aspect-ratio:16/9}
.modal-inner video,.modal-inner img{width:100%;height:100%;object-fit:contain;background:#000}

/* 响应式 */
@media(max-width:768px){
  .about-grid{grid-template-columns:1fr;text-align:center}
  .skills{justify-content:center}
  .works-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem}
  .story{padding:3rem 1.5rem}
  .chapter{font-size:2rem}
}
</style>
</head>
<body>

<!-- 灯光 -->
<div class="light l1"></div>
<div class="light l2"></div>

<!-- ===== Hero ===== -->
<section class="hero" id="hero">
  <div class="lede" id="heroLede">DIRECTOR · EDITOR · CREATOR</div>
  <h1><span class="line" id="heroName">谢时庆</span></h1>
  <p class="sub" id="heroSub">用镜头叙事，让每帧都有力量</p>
  <div class="scroll">▼ SCROLL ▼</div>
</section>

<!-- ===== 关于 ===== -->
<section class="story" id="aboutSec">
  <div class="container">
    <div class="chapter"><span class="num">第一章</span>关于<span style="color:var(--gold)">我</span></div>
    <div class="about-grid">
      <div class="about-text">
        <h3 id="aboutTitle">用影像书写</h3>
        <p id="aboutText">独立视频创作者。专注于品牌短片、广告创意与内容策划。五年行业经验，服务超过100家商户。擅长通过视觉叙事为品牌注入情感与力量。</p>
        <div class="skills" id="skillTags">
          <span>导演</span><span>剪辑</span><span>调色</span><span>创意策划</span><span>品牌短片</span><span>内容运营</span>
        </div>
      </div>
      <div class="about-visual">
        <div class="frame">🎬</div>
        <span class="label">Cinematic Storyteller</span>
      </div>
    </div>
  </div>
</section>

<!-- ===== 作品 ===== -->
<section class="story" id="worksSec">
  <div class="container">
    <div class="chapter"><span class="num">第二章</span>精选<span style="color:var(--gold)">作品</span></div>
    <div class="works-grid" id="worksGrid">
      <!-- JS 动态填充 -->
    </div>
  </div>
</section>

<!-- ===== 联系 ===== -->
<section class="story" id="contactSec">
  <div class="container">
    <div class="chapter"><span class="num">第三章</span>找到<span style="color:var(--gold)">我</span></div>
    <div class="credits" id="credits">
      <span class="role">邮箱</span><span class="name" id="cEmail">1559840686@qq.com</span>
      <span class="role">微信</span><span class="name" id="cWechat">XQinghhsh</span>
      <span class="role">手机</span><span class="name" id="cPhone">19968001943</span>
    </div>
  </div>
</section>

<!-- Modal -->
<div class="modal" id="modal">
  <button class="modal-close" id="modalClose">&times;</button>
  <div class="modal-inner" id="modalContent"></div>
</div>

<!-- 音乐 -->
<button id="musicBtn" title="音乐">♪</button>
<audio id="bgAudio" loop preload="metadata"></audio>

<script>
// ===== 数据 =====
const DATA={
  name:'谢时庆',
  lede:'DIRECTOR · EDITOR · CREATOR',
  subtitle:'用镜头叙事，让每帧都有力量',
  aboutTitle:'用影像书写',
  aboutText:'独立视频创作者。专注于品牌短片、广告创意与内容策划。五年行业经验，服务超过100家商户。擅长通过视觉叙事为品牌注入情感与力量。',
  skills:['导演','剪辑','调色','创意策划','品牌短片','内容运营'],
  email:'1559840686@qq.com',wechat:'XQinghhsh',phone:'19968001943',
  music:'https://music.163.com/song/media/outer/url?id=28267530.mp3',
  works:[
    {title:'品牌故事·匠心',category:'商业片',duration:'2:30',url:'',poster:''},
    {title:'情绪短片·城市独白',category:'短视频',duration:'0:45',url:'',poster:''},
    {title:'产品大片·质感',category:'混剪',duration:'1:15',url:'',poster:''},
  ]
};

// 加载云端数据
fetch('https://anheinh.github.io/data.json?v=2')
  .then(r=>r.json()).then(d=>Object.assign(DATA,d)).catch(()=>{})
  .finally(()=>renderAll());

function renderAll(){
  document.getElementById('heroName').textContent=DATA.name;
  document.getElementById('heroLede').textContent=DATA.lede;
  document.getElementById('heroSub').textContent=DATA.subtitle;
  document.getElementById('aboutTitle').textContent=DATA.aboutTitle;
  document.getElementById('aboutText').textContent=DATA.aboutText;

  const tags=document.getElementById('skillTags');tags.innerHTML='';
  DATA.skills.forEach(s=>{const sp=document.createElement('span');sp.textContent=s;tags.appendChild(sp)});

  document.getElementById('cEmail').textContent=DATA.email;
  document.getElementById('cWechat').textContent=DATA.wechat;
  document.getElementById('cPhone').textContent=DATA.phone;

  renderWorks();
}

function renderWorks(){
  const grid=document.getElementById('worksGrid');
  if(!DATA.works.length){grid.innerHTML='<div class="empty-state"><div class="icon">🎬</div><p>作品即将上线</p></div>';return}

  grid.innerHTML='';
  DATA.works.forEach(w=>{
    const card=document.createElement('div');card.className='poster';
    const posterBg=w.poster?'background:url('+w.poster+') center/cover':'background:linear-gradient(135deg,#1a1a2e 0%,#0d0d16 50%,#1c1624 100%)';
    card.innerHTML=
      '<div class="bg" style="'+posterBg+'"></div>'+
      '<div class="play-icon"></div>'+
      '<div class="meta"><div class="cat">'+w.category+'</div><div class="title">'+w.title+'</div>'+(w.duration?'<div class="dur">⏱ '+w.duration+'</div>':'')+'</div>';
    card.onclick=()=>openModal(w);
    grid.appendChild(card);
  });
}

// ===== Modal =====
const modal=document.getElementById('modal'),modalContent=document.getElementById('modalContent');
function openModal(work){
  if(work.url)modalContent.innerHTML='<video src="'+work.url+'" controls autoplay playsinline></video>';
  else modalContent.innerHTML='<div style="text-align:center;color:var(--muted);padding:3rem"><div style="font-size:4rem;margin-bottom:2rem">🎬</div><p style="font-size:1.2rem;color:var(--fg);margin-bottom:.5rem">'+work.title+'</p><p>视频即将上线</p></div>';
  modal.classList.add('show');
}
document.getElementById('modalClose').onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
document.onkeydown=e=>{if(e.key==='Escape')modal.classList.remove('show')};

// ===== 音乐 =====
const audio=document.getElementById('bgAudio'),musicBtn=document.getElementById('musicBtn');
let playing=false;
if(DATA.music)audio.src=DATA.music+'?v=2';
musicBtn.onclick=()=>{
  if(playing){audio.pause();playing=false;musicBtn.classList.remove('on')}
  else{audio.volume=.2;audio.play().catch(()=>{});playing=true;musicBtn.classList.add('on')}
};

// ===== 滚动出场动画 =====
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.style.opacity='1';e.target.style.transform='translateY(0)';
      observer.unobserve(e.target);
    }
  });
},{threshold:.2});

document.querySelectorAll('.story').forEach(el=>{
  el.style.opacity='0';el.style.transform='translateY(40px)';
  el.style.transition='opacity 1s ease,transform 1s ease';
  observer.observe(el);
});
</script>
</body>
</html>
